server.port=8080

# H2 for local dev (PostgreSQL for production on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/recruitmentdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.api-key=${INTERNAL_API_KEY:recruit-internal-secret-key-2024}

# Email (optional - app works without it, emails are logged instead)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Frontend URL for email links
frontend.url=${FRONTEND_URL:http://localhost:3000}
